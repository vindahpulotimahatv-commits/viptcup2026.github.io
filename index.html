<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIPT CUP IV 2026 Match Center</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:white;
font-family:Montserrat,Arial;
}

.container{
max-width:700px;
margin:auto;
padding-bottom:40px;
}


/* HEADER */

.header img{
width:100%;
display:block;
}



/* CARD */

.card{

margin:15px;

padding:18px;

background:
linear-gradient(145deg,#17120a,#050505);

border:1px solid #b8861b;

border-radius:22px;

box-shadow:
0 10px 30px rgba(0,0,0,.6);

}


.title{

text-align:center;

font-size:22px;

font-weight:900;

color:#fbbf24;

}



/* LIVE YOUTUBE */

.youtube{

width:100%;

aspect-ratio:16/9;

border:0;

border-radius:18px;

}



/* MATCH */

.match{

text-align:center;

}



.teams{

display:flex;

align-items:center;

justify-content:space-around;

margin-top:20px;

}



.team{

width:40%;

font-weight:900;

font-size:14px;

}



.team img{

width:95px;

height:95px;

object-fit:contain;

background:white;

border-radius:18px;

padding:5px;

}



.score{

font-size:55px;

font-weight:900;

color:#fbbf24;

}



.status{

margin-top:15px;

color:#22c55e;

font-weight:900;

}



/* CABOR */

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}



.menu{

background:#111;

border:1px solid #8b650f;

padding:16px;

border-radius:16px;

text-align:center;

font-weight:900;

font-size:13px;

}


</style>

</head>


<body>
