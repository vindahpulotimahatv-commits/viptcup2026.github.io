<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
VIPT CUP IV 2026 MATCH CENTER
</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;

background:
radial-gradient(circle at top,#3a2500,#050505 55%);

font-family:
'Montserrat',
Arial,
sans-serif;

color:white;

}



.container{

max-width:720px;

margin:auto;

padding-bottom:50px;

}



/* HEADER */

.header{

padding:15px;

}


.header img{

width:100%;

border-radius:20px;

}



/* CARD */

.card{

margin:15px;

padding:18px;

background:

linear-gradient(
145deg,
#18120a,
#050505
);


border:

1px solid #b8861b;


border-radius:24px;


box-shadow:

0 10px 35px rgba(0,0,0,.7);

}



.title{

text-align:center;

font-size:22px;

font-weight:900;

color:#fbbf24;

}





/* VIDEO */

.video{

width:100%;

aspect-ratio:16/9;

border:0;

border-radius:18px;

}





/* LIVE MATCH */

.live-match{

text-align:center;

}



.teams{

display:flex;

justify-content:space-around;

align-items:center;

margin-top:20px;

}



.team{

width:35%;

font-size:14px;

font-weight:900;

}



.team img{

width:90px;

height:90px;

object-fit:contain;

background:white;

border-radius:18px;

padding:5px;

box-shadow:

0 5px 15px rgba(0,0,0,.5);

}




.score{

font-size:38px;

font-weight:900;

color:#fbbf24;

letter-spacing:4px;

}



.center-info{

margin-top:15px;

font-size:14px;

font-weight:900;

color:#fbbf24;

line-height:1.8;

}



.status{

margin-top:10px;

font-size:17px;

font-weight:900;

color:#22c55e;

}





/* CABOR */

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}



.menu{

background:#0c0c0c;

border:

1px solid #8b650f;

padding:16px;

border-radius:18px;

text-align:center;

font-weight:900;

}





/* BUTTON */

.btn{

display:block;

background:#fbbf24;

color:#000;

text-decoration:none;

padding:15px;

border-radius:18px;

font-weight:900;

text-align:center;

}




.info{

text-align:center;

font-size:14px;

line-height:1.7;

}



</style>


</head>


<body>


<div class="container">



<!-- HEADER VIPT -->

<div class="header">

<img src="assets/header-vipt-web.png">

</div>





<!-- TITLE -->


<div class="card">

<div class="title">

🏆 VIPT CUP IV 2026

</div>


<p style="text-align:center">

OFFICIAL MATCH CENTER

</p>


</div>






<!-- YOUTUBE LIVE -->


<div class="card">


<div class="title">

🎥 LIVE STREAMING

</div>


<br>


<iframe

class="video"

src="https://www.youtube.com/embed/RJGbsrd_dkU?autoplay=1&mute=1"

allow="autoplay; encrypted-media"

allowfullscreen>

</iframe>


</div>






<!-- LIVE SCORE -->


<div class="card live-match">


<div class="title">

🔴 LIVE MATCH

</div>



<div class="teams">


<div class="team">


<img id="logoA" src="">


<br>


<span id="teamA">

TIM A

</span>


</div>





<div>


<div class="score">


<span id="scoreA">
0
</span>


-

<span id="scoreB">
0
</span>


</div>


</div>





<div class="team">


<img id="logoB" src="">


<br>


<span id="teamB">

TIM B

</span>


</div>



</div>





<div class="center-info">


<span id="sport">

VOLLY PUTRA

</span>


<br>


<span id="period">

SET 1

</span>


</div>



<div class="status">


🟢

<span id="status">

LIVE SEKARANG

</span>


</div>



</div>
