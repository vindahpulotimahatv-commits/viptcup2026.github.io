<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIPT CUP IV 2026</title>
<style>
    body { font-family: sans-serif; background: #123d38; color: #fff; padding: 20px; }
    .card { background: #174c46; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { color: #f6b83f; text-align: left; }
    td, th { padding: 8px; border-bottom: 1px solid #2c736b; }
</style>
</head>
<body>

    <!-- Tombol Navigasi -->
    <div style="margin-bottom: 20px;">
        <button onclick="document.getElementById('beranda').style.display='block'; document.getElementById('topskor').style.display='none';">Beranda</button>
        <button onclick="document.getElementById('beranda').style.display='none'; document.getElementById('topskor').style.display='block';">Top Skor</button>
    </div>

    <!-- Halaman Beranda -->
    <div id="beranda">
        <h1>VIPT CUP IV 2026</h1>
        <div class="card">Selamat Datang di Official Match Center</div>
    </div>

    <!-- Halaman Top Skor -->
    <div id="topskor" class="hidden">
        <h2>Top Skor Futsal</h2>
        <div class="card">
            <p>Total Gol Keseluruhan: <b id="totalGol">0</b></p>
            <table id="tabelSkor">
                <thead><tr><th>Nama</th><th>Tim</th><th>Gol</th></tr></thead>
                <tbody id="isiTabel"></tbody>
            </table>
        </div>
    </div>

<script>
    const dataSkor = [
        {name: "ARIFIN", team: "RT 13", goals: 7},
        {name: "TOTO", team: "RT 11", goals: 6},
        {name: "SATRIA", team: "RT 10", goals: 5}
    ];

    function render() {
        const tbody = document.getElementById("isiTabel");
        let total = 0;
        dataSkor.forEach(p => {
            total += p.goals;
            tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.team}</td><td>${p.goals}</td></tr>`;
        });
        document.getElementById("totalGol").innerText = total;
    }
    render();
</script>
</body>
</html>
