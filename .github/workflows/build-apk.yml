name: Build VIPT CUP IV 2026 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets --no-audit --no-fund

      - name: Generate Android icons
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web files
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIPT-CUP-IV-2026-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
