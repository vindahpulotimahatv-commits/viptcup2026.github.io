name: Build VIPT CUP IV 2026 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. NODE JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm ci


      # ==========================================
      # 4. SIAPKAN WWW
      # ==========================================
      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>VIPT CUP IV 2026</title>
          </head>
          <body>
            <p style="font-family:Arial;text-align:center;margin-top:40px">
              Membuka VIPT CUP IV 2026...
            </p>
          </body>
          </html>
          EOF


      # ==========================================
      # 5. CEK CAPACITOR
      # ==========================================
      - name: Check Capacitor
        run: npx cap --version


      # ==========================================
      # 6. TAMBAHKAN ANDROID JIKA BELUM ADA
      # ==========================================
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform sudah ada."
          fi


      # ==========================================
      # 7. SYNC CAPACITOR
      # ==========================================
      - name: Sync Android
        run: npx cap sync android


      # ==========================================
      # 8. BUILD APK DEBUG
      # ==========================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ==========================================
      # 9. COPY APK
      # ==========================================
      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/VIPT-CUP-IV-2026.apk


      # ==========================================
      # 10. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIPT-CUP-IV-2026-APK
          path: release/VIPT-CUP-IV-2026.apk
