name: Build VIPT CUP IV 2026 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # 3. NODE JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 4. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm install


      # ==========================================
      # 5. SIAPKAN WWW
      # ==========================================
      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>VIPT CUP IV 2026</title>
          </head>
          <body>
            <p style="font-family:Arial;text-align:center;margin-top:40px">
              Membuka VIPT CUP IV 2026...
            </p>
          </body>
          </html>
          EOF


      # ==========================================
      # 6. CEK CAPACITOR
      # ==========================================
      - name: Check Capacitor
        run: npx cap --version


      # ==========================================
      # 7. TAMBAHKAN ANDROID
      # ==========================================
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform sudah ada."
          fi


      # ==========================================
      # 8. SYNC CAPACITOR
      # ==========================================
      - name: Sync Android
        run: npx cap sync android


      # ==========================================
      # 9. PASANG ICON VIPT CUP
      # ==========================================
      - name: Install VIPT CUP launcher icon
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/assets/icon.png"
          RES="$GITHUB_WORKSPACE/android/app/src/main/res"
          MANIFEST="$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml"

          echo "Memeriksa icon..."
          test -f "$ICON"

          echo "Icon ditemukan:"
          file "$ICON"

          # Buat folder drawable
          mkdir -p "$RES/drawable"

          # Salin icon VIPT CUP
          cp "$ICON" "$RES/drawable/viptcup_launcher.png"

          echo "Icon disalin ke:"
          ls -lh "$RES/drawable/viptcup_launcher.png"

          # Ubah AndroidManifest agar menggunakan icon VIPT CUP
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text(encoding="utf-8")

          # Hapus icon lama
          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          # Pasang icon VIPT CUP
          text = re.sub(
              r'<application\b',
              '<application android:icon="@drawable/viptcup_launcher" android:roundIcon="@drawable/viptcup_launcher"',
              text,
              count=1
          )

          manifest.write_text(text, encoding="utf-8")
          PY

          echo "Manifest icon:"
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml


      # ==========================================
      # 10. CEK ICON SEBELUM BUILD
      # ==========================================
      - name: Verify VIPT CUP icon
        run: |
          echo "=== ICON ==="
          ls -lh android/app/src/main/res/drawable/viptcup_launcher.png

          echo "=== MANIFEST ==="
          grep -nE "android:icon|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml


      # ==========================================
      # 11. CEK GRADLE
      # ==========================================
      - name: Check Android build environment
        working-directory: android
        run: |
          java -version
          javac -version
          ./gradlew --version


      # ==========================================
      # 12. BUILD APK
      # ==========================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug


      # ==========================================
      # 13. SIAPKAN APK
      # ==========================================
      - name: Prepare APK artifact
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/VIPT-CUP-IV-2026.apk


      # ==========================================
      # 14. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIPT-CUP-IV-2026-APK
          path: release/VIPT-CUP-IV-2026.apk
