<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIPT CUP IV 2026 Desktop Match Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
.screen{height:100vh;padding:25px;display:grid;grid-template-rows:90px 1fr 130px;gap:20px}
.header{border:2px solid #c69219;border-radius:20px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 35px}
.title{font-size:42px;font-weight:900;color:#f5c451}
.live{background:#b00000;padding:15px 30px;border-radius:50px;font-weight:bold}
.content{display:grid;grid-template-columns:1fr 300px;gap:20px}
.main,.side,.bottom{border:2px solid #8b6418;border-radius:22px;background:linear-gradient(145deg,#151515,#070707)}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center}
.sport{font-size:32px;color:#f5c451;font-weight:bold}
.match{width:90%;display:grid;grid-template-columns:1fr 220px 1fr;align-items:center;text-align:center;margin-top:35px}
.team{font-size:28px;font-weight:bold}
.logo{width:130px;height:130px;background:#fff;border-radius:20px;margin-bottom:15px}
.score{font-size:100px;font-weight:900;color:#f5c451}
.status{font-size:25px;color:#39df89}
.side{padding:20px}
.side h2{color:#f5c451}
.card{background:#1c1c1c;border-radius:15px;padding:15px;margin-bottom:15px}
.bottom{display:flex;justify-content:space-around;align-items:center;padding:20px;font-size:22px;color:#f5c451}
</style>
</head>
<body>
<div class="screen">
<div class="header">
<div class="title">🏆 VIPT CUP IV 2026 • OFFICIAL MATCH CENTER</div>
<div class="live">🔴 LIVE</div>
</div>

<div class="content">
<div class="main">
<div class="sport">VOLLY PUTRA • FINAL</div>
<div class="match">
<div class="team"><div class="logo"></div>RT 08 / RW 021</div>
<div><div class="score">0 - 0</div><div class="status">SET 1 • LIVE</div></div>
<div class="team"><div class="logo"></div>RT 11 / RW 021</div>
</div>
</div>

<div class="side">
<h2>📅 NEXT MATCH</h2>
<div class="card">Pertandingan berikutnya</div>
<h2>📰 NEWS</h2>
<div class="card">Update VIPT CUP IV 2026</div>
</div>
</div>

<div class="bottom">
<div>📡 LIVE SCORE</div>
<div>🏆 KLASMEN</div>
<div>📰 NEWS</div>
<div>🔔 NOTIFIKASI</div>
</div>
</div>
</body>
</html>
