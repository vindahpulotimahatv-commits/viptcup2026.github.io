<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>Hasil Atlet Terfavorit RT 08 RW 021 • Panitia VIPT CUP IV 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{--bg:#050505;--gold:#f5b72b;--muted:#c7c0b2;--green:#1ed393}
*{box-sizing:border-box}
body{margin:0;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif;padding-bottom:40px}
.app{max-width:640px;margin:auto;padding:0 16px}
header{padding:20px 0 8px;text-align:center}
header .logo{font-size:26px}
header h1{font-size:16px;margin:8px 0 2px;color:var(--gold)}
header p{font-size:11px;color:var(--muted);margin:0}
.card{background:linear-gradient(145deg,#11100d,#050505);border:1px solid #6f4d13;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cat-title{font-size:14px;font-weight:900;color:var(--gold);margin:0 0 4px}
.cat-total{font-size:10.5px;color:var(--muted);margin-bottom:14px}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.bar-label b{color:#fff}
.bar-label span{color:var(--gold);font-weight:900}
.bar-track{background:#0c0b09;border:1px solid #221c10;border-radius:99px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#9a650b,#f5b72b);transition:width .5s ease}
.bar-row.top .bar-fill{background:linear-gradient(90deg,#1ed393,#0d8f66)}
.bar-row.top .bar-label span{color:var(--green)}
.crown-tag{font-size:9px;color:var(--green);font-weight:900;margin-left:6px}
.empty{text-align:center;color:var(--muted);font-size:11.5px;padding:14px 0}
.status{font-size:11px;text-align:center;margin:10px 0;color:var(--muted)}
.back{display:block;text-align:center;margin-top:10px;font-size:11px;color:#f5c451;text-decoration:none}
#gateCard{max-width:360px;margin:60px auto 0;text-align:center}
label{display:block;font-size:11px;font-weight:900;color:var(--gold);margin:0 0 6px;text-align:left}
input.pinField{width:100%;background:#080807;border:1px solid #6f4d13;color:#fff;border-radius:12px;padding:13px 14px;outline:none;margin-bottom:14px;font-size:14px;box-sizing:border-box}
.btn{display:block;width:100%;text-align:center;color:#090705;background:linear-gradient(135deg,#f5b72b,#9a650b);border:none;border-radius:12px;padding:13px;font-size:12.5px;font-weight:900;cursor:pointer}
.gate-status{font-size:11px;color:#ff5a5f;margin-top:10px;min-height:14px}

.section-title{font-size:13px;font-weight:900;color:var(--gold);margin:20px 2px 10px}
.search-field{width:100%;background:#080807;border:1px solid #6f4d13;color:#fff;border-radius:12px;padding:11px 14px;outline:none;margin-bottom:12px;font-size:13px;box-sizing:border-box}
.house-item{border:1px solid #221c10;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.house-item:last-child{margin-bottom:0}
.house-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.house-head b{font-size:14px;color:var(--gold)}
.house-head span{font-size:10px;color:var(--muted)}
.house-pick{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-top:1px solid #1a1509}
.house-pick:first-of-type{border-top:none}
.house-pick span{color:var(--muted)}
.house-pick b{color:#fff;text-align:right}
</style>
</head>
<body>
<div class="app">
  <div class="card" id="gateCard">
    <div style="font-size:30px;margin-bottom:8px">🔒</div>
    <h1 style="font-size:15px;color:var(--gold);margin:0 0 10px">PANEL PANITIA</h1>
    <p style="font-size:11px;color:var(--muted);margin:0 0 16px">Masukkan PIN untuk melihat hasil voting</p>
    <label for="pinInput">PIN Panitia</label>
    <input class="pinField" id="pinInput" type="password" inputmode="text" placeholder="••••••••••••">
    <button class="btn" id="btnUnlock">🔓 BUKA HASIL</button>
    <div class="gate-status" id="gateStatus"></div>
  </div>

  <div id="panelWrap" style="display:none">
  <header>
    <div class="logo">🗳️</div>
    <h1>HASIL ATLET TERFAVORIT RT 08 RW 021</h1>
    <p>VIPT CUP IV 2026 • Khusus Panitia</p>
  </header>

  <div class="status" id="statusMsg">Memuat...</div>
  <div id="resultBox"></div>

  <div class="section-title" id="detailTitle" style="display:none">🏠 Detail Suara per Rumah</div>
  <input class="search-field" id="searchHouse" placeholder="Cari nomor rumah, misal: E2/47" style="display:none">
  <div id="detailBox"></div>

  <a class="back" href="index.html">← Kembali ke Beranda</a>
  </div>
</div>

<script>
const VOTE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};
const VOTE_PATH="vipt_vote/votes";

// Sama persis dengan urutan kategori di vote.html
const CATEGORIES=[
  {id:"bdw",label:"Badminton Putri"},
  {id:"bdm",label:"Badminton Putra"},
  {id:"vw",label:"Volly Putri"}
];

const ADMIN_PIN="rt08admin123";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const resultBox=document.getElementById("resultBox"),statusMsg=document.getElementById("statusMsg");
const detailBox=document.getElementById("detailBox"),detailTitle=document.getElementById("detailTitle"),searchHouse=document.getElementById("searchHouse");
let ALL_VOTES=[];

function renderDetailByHouse(filterText){
  const filter=(filterText||"").trim().toLowerCase();
  const byHouse={};
  ALL_VOTES.forEach(v=>{
    const house=v.houseNumber||"-";
    if(!byHouse[house])byHouse[house]={voterName:v.voterName||"",picks:{}};
    byHouse[house].picks[v.category]=v.candidate;
    if(v.voterName)byHouse[house].voterName=v.voterName;
  });
  let houses=Object.entries(byHouse).sort((a,b)=>a[0].localeCompare(b[0]));
  if(filter)houses=houses.filter(([house,d])=>house.toLowerCase().includes(filter)||(d.voterName||"").toLowerCase().includes(filter));

  if(!houses.length){
    detailBox.innerHTML=`<div class="card"><div class="empty">${filter?"Tidak ada rumah yang cocok dicari.":"Belum ada suara masuk."}</div></div>`;
    return;
  }

  detailBox.innerHTML=`<div class="card">` + houses.map(([house,d])=>`
    <div class="house-item">
      <div class="house-head"><b>🏠 ${esc(house)}</b><span>${esc(d.voterName||"-")}</span></div>
      ${CATEGORIES.map(cat=>`<div class="house-pick"><span>${esc(cat.label)}</span><b>${esc(d.picks[cat.id]||"-")}</b></div>`).join("")}
    </div>`).join("") + `</div>`;
}

searchHouse.addEventListener("input",()=>renderDetailByHouse(searchHouse.value));

function renderResults(votes){
  const all=Object.values(votes);
  resultBox.innerHTML=CATEGORIES.map(cat=>{
    const catVotes=all.filter(v=>v.category===cat.id);
    const tally={};
    catVotes.forEach(v=>{tally[v.candidate]=(tally[v.candidate]||0)+1});
    const rows=Object.entries(tally).map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n);
    const max=Math.max(1,...rows.map(r=>r.n));
    const total=catVotes.length;

    if(!rows.length){
      return `<div class="card">
        <div class="cat-title">${esc(cat.label)}</div>
        <div class="cat-total">0 suara masuk</div>
        <div class="empty">Belum ada yang voting di kategori ini.</div>
      </div>`;
    }

    return `<div class="card">
      <div class="cat-title">${esc(cat.label)}</div>
      <div class="cat-total">${total} suara masuk</div>
      ${rows.map((r,i)=>{
        const pct=Math.round((r.n/max)*100);
        const pctTotal=total?Math.round((r.n/total)*100):0;
        return `<div class="bar-row ${i===0?"top":""}">
          <div class="bar-label"><b>${esc(r.name)}${i===0?'<span class="crown-tag">👑 TERATAS</span>':""}</b><span>${r.n} suara (${pctTotal}%)</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}

async function initFirebase(){
  try{
    const app=firebase.apps.find(a=>a.name==="viptVote")||firebase.initializeApp(VOTE_FIREBASE_CONFIG,"viptVote");
    const auth=app.auth(),db=app.database();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!auth.currentUser)await auth.signInAnonymously();
    db.ref(VOTE_PATH).on("value",snap=>{
      const votes=snap.val()||{};
      ALL_VOTES=Object.values(votes);
      renderResults(votes);
      detailTitle.style.display="block";
      searchHouse.style.display="block";
      renderDetailByHouse(searchHouse.value);
      statusMsg.textContent="✅ Data live • otomatis update";
    });
  }catch(e){
    console.error("Vote result init:",e);
    statusMsg.textContent="⚠️ Gagal terhubung ["+(e?.code||"koneksi-error")+"]";
  }
}

document.getElementById("btnUnlock").addEventListener("click",()=>{
  const pinInput=document.getElementById("pinInput");
  if(pinInput.value.trim()===ADMIN_PIN){
    document.getElementById("gateCard").style.display="none";
    document.getElementById("panelWrap").style.display="block";
    initFirebase();
  }else{
    document.getElementById("gateStatus").textContent="⚠️ PIN salah, coba lagi.";
  }
});
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("btnUnlock").click()});
</script>
</body>
</html>
