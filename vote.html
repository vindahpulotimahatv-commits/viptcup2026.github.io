<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#050505">
<title>Atlet Terfavorit RT 08 RW 021 • VIPT CUP IV 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{--bg:#050505;--panel:#0b0b0b;--line:#7a5514;--text:#fff;--muted:#c7c0b2;--gold:#f5b72b;--green:#1ed393;--red:#ff5a5f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;min-height:100%}
body{margin:0;background:#030303;color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding:0 16px}
header{padding:22px 0 10px;text-align:center}
header .logo{font-size:26px}
header h1{font-size:17px;margin:8px 0 2px;color:var(--gold)}
header p{font-size:11px;color:var(--muted);margin:0 0 16px}

.card{background:linear-gradient(145deg,#11100d,#050505);border:1px solid #6f4d13;border-radius:17px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cat-title{font-size:15px;font-weight:900;color:var(--gold);margin:0 0 12px;text-align:center;border-bottom:1px dashed #3a2a08;padding-bottom:10px}

.candidate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#080807;border:1px solid #3a2a08;border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.candidate:last-child{margin-bottom:0}
.candidate.selected{border-color:var(--gold);background:rgba(245,183,43,.08)}
.candidate b{font-size:13px}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid #6f4d13;flex:0 0 auto;position:relative}
.candidate.selected .radio-dot{border-color:var(--gold)}
.candidate.selected .radio-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}

.btn{display:block;width:100%;text-align:center;text-decoration:none;color:#090705;background:linear-gradient(135deg,#f5b72b,#9a650b);border:none;border-radius:12px;padding:14px;font-size:12.5px;font-weight:900;cursor:pointer;margin-top:20px}
.btn:disabled{opacity:.5}
.note{font-size:10px;color:#8a8378;margin-top:10px;line-height:1.5;text-align:center}
.status{font-size:11px;text-align:center;margin-top:10px;color:var(--gold);min-height:14px;font-weight:bold}
.voted-badge{text-align:center;padding:14px;border:1px dashed var(--green);border-radius:12px;color:var(--green);font-size:12px;font-weight:900;margin-top:20px}
.back{display:block;text-align:center;margin-top:16px;font-size:11px;color:#f5c451;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🗳️</div>
    <h1>ATLET TERFAVORIT RT 08 RW 021</h1>
    <p>VIPT CUP IV 2026</p>
  </header>

  <div id="voteArea"></div>

  <a class="back" href="index.html">← Kembali ke Beranda</a>
</div>

<script>
const VOTE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};
const VOTE_PATH="vipt_vote/votes";
const VOTE_LOCAL_KEY="VIPT_VOTE_DONE_ALL_V3"; 

const CATEGORIES=[
  {id:"bdw",label:"Badminton Putri",candidates:["Erni (E2/45)","Nopy (E2/39)","Sherly (E2/40)","Ressya (E2/28)","Bety (E5/08)","Risna (E5/3A)","Neza (E2/22)","Dina (E2/41)","Nina (E5/07)"]},
  {id:"bdm",label:"Badminton Putra",candidates:["Adin (E8/02)","Diantoro (E2/22)","Iqbal (E2/39)","Hendy (E2/39)","Jarun (E2/46)","Lambang (E2/22)","Ngudi (E2/15)","Faozi (E5/16)","Ajrul (E2/40)"]},
  {id:"vw",label:"Volly Putri",candidates:["Puji (E2/22)","Rohyana (E2/07)","Rosiyati (E2/15)","Seny (E2/14)","Ayu (E2/03)","Adel (E5/06)","Syifa (E2/29)","Bilqis (E2/07)","Hafiza (E2/03)","Jihan (E2/13)"]}
];

let voteApp=null,voteAuth=null,voteDB=null;
let hasVotedAll = false;
let selections = { bdw: null, bdm: null, vw: null };

function loadStorageData(){
  try{
    hasVotedAll=localStorage.getItem(VOTE_LOCAL_KEY) === "true";
  }catch(e){}
}

function saveStorageData(){
  try{
    localStorage.setItem(VOTE_LOCAL_KEY, "true");
  }catch(e){}
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const voteArea=document.getElementById("voteArea");

function renderVoteArea(){
  if(hasVotedAll){
    voteArea.innerHTML=`
      <div class="card">
        <div class="cat-title">Terima Kasih!</div>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin:0">Suaramu telah berhasil masuk ke dalam sistem.</p>
        <div class="voted-badge">✅ Kamu sudah melakukan voting.</div>
      </div>`;
    return;
  }

  let htmlStr = "";

  CATEGORIES.forEach(cat => {
    htmlStr += `
      <div class="card" id="card-${cat.id}">
        <div class="cat-title">${esc(cat.label)}</div>
        <div class="candidate-list" data-cat="${cat.id}">
          ${cat.candidates.map(name => `
            <div class="candidate" data-name="${esc(name)}">
              <b>${esc(name)}</b>
              <div class="radio-dot"></div>
            </div>
          `).join('')}
        </div>
      </div>`;
  });

  htmlStr += `
    <button class="btn" id="btnVoteAll">🗳️ KIRIM SEMUA VOTE SEKALIGUS</button>
    <div class="status" id="statusMsg"></div>
    <p class="note">Pilih satu kandidat di setiap kategori. Satu perangkat hanya bisa vote 1x. Vote bersifat anonim dan tidak bisa diubah setelah dikirim.</p>`;

  voteArea.innerHTML = htmlStr;

  // Interaksi Pilihan Kandidat
  CATEGORIES.forEach(cat => {
    const listWrapper = document.querySelector(`.candidate-list[data-cat="${cat.id}"]`);
    const candidates = listWrapper.querySelectorAll(".candidate");
    
    candidates.forEach(el => {
      el.addEventListener("click", () => {
        selections[cat.id] = el.dataset.name;
        candidates.forEach(c => c.classList.toggle("selected", c === el));
      });
    });
  });

  // Interaksi Submit
  const btnVote = document.getElementById("btnVoteAll");
  const statusMsg = document.getElementById("statusMsg");

  btnVote.addEventListener("click", async () => {
    // Pastikan semua kategori sudah dipilih
    for(const cat of CATEGORIES) {
      if(!selections[cat.id]) {
        statusMsg.textContent=`⚠️ Anda belum memilih kandidat untuk ${cat.label}.`;
        document.getElementById(`card-${cat.id}`).scrollIntoView({behavior: "smooth", block: "center"});
        return;
      }
    }

    if(!voteDB){statusMsg.textContent="⚠️ Belum terhubung ke server, coba lagi sebentar.";return}
    
    btnVote.disabled=true;
    btnVote.textContent="MENGIRIM DATA...";
    statusMsg.textContent="Memproses suara Anda...";

    try{
      // Persiapkan semua vote untuk di-push ke database tanpa data diri
      const promises = CATEGORIES.map(cat => {
        return voteDB.ref(VOTE_PATH).push().set({
          category: cat.id,
          categoryLabel: cat.label,
          candidate: selections[cat.id],
          votedAt: firebase.database.ServerValue.TIMESTAMP
        });
      });

      await Promise.all(promises);

      hasVotedAll = true;
      saveStorageData();
      renderVoteArea();
      
    }catch(e){
      console.error("Vote submit:",e);
      statusMsg.textContent="⚠️ Gagal mengirim vote. Periksa koneksi internet Anda.";
      btnVote.disabled=false;
      btnVote.textContent="🗳️ KIRIM SEMUA VOTE SEKALIGUS";
    }
  });
}

async function initFirebase(){
  try{
    voteApp=firebase.apps.find(a=>a.name==="viptVote")||firebase.initializeApp(VOTE_FIREBASE_CONFIG,"viptVote");
    voteAuth=voteApp.auth();voteDB=voteApp.database();
    await voteAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!voteAuth.currentUser)await voteAuth.signInAnonymously();
  }catch(e){
    console.error("Vote init:",e);
  }
}

loadStorageData();
renderVoteArea();
initFirebase();
</script>
</body>
</html>
