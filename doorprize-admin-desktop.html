<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>Panel Undian Doorprize (Desktop) • Panitia VIPT CUP IV 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#050505;--panel:#0b0b0b;--line:#7a5514;--text:#fff;--muted:#c7c0b2;
  --gold:#f5b72b;--green:#1ed393;--red:#ff5a5f
}
*{box-sizing:border-box}
body{
  margin:0;background:#030303;color:var(--text);
  font-family:Arial,Helvetica,sans-serif;min-height:100vh
}
button,input{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:30px 28px 60px}

header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
header.top .brand{display:flex;align-items:center;gap:14px}
header.top .brand .logo{font-size:34px}
header.top h1{font-size:20px;margin:0;color:var(--gold)}
header.top p{font-size:12px;color:var(--muted);margin:2px 0 0}
.mobile-link{font-size:11.5px;color:#f5c451;text-decoration:none;border:1px solid #6f4d13;padding:9px 14px;border-radius:10px}
.mobile-link:hover{border-color:var(--gold)}

.card{
  background:linear-gradient(145deg,#11100d,#050505);
  border:1px solid #6f4d13;border-radius:18px;padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.35)
}
label{display:block;font-size:12px;font-weight:900;color:var(--gold);margin:0 0 8px}
input.field{
  width:100%;background:#080807;border:1px solid #6f4d13;color:#fff;
  border-radius:12px;padding:15px 16px;outline:none;margin-bottom:16px;font-size:15px
}
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;color:#090705;
  background:linear-gradient(135deg,#f5b72b,#9a650b);border:none;
  border-radius:12px;padding:16px;font-size:13.5px;font-weight:900;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.secondary{background:linear-gradient(135deg,#2a2a2a,#0e0e0e);color:#f5c451;border:1px solid #6f4d13}
.btn:disabled{opacity:.5;cursor:not-allowed}

#gateCard{max-width:420px;margin:80px auto 0}

.grid{display:grid;grid-template-columns:1.35fr .95fr;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

.stats{display:flex;gap:14px;margin-bottom:18px}
.stat{flex:1;background:#0c0b09;border:1px solid #6f4d13;border-radius:14px;padding:18px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--gold)}
.stat span{font-size:11px;color:var(--muted)}

/* ==== WHEEL ==== */
.wheel-wrap{position:relative;display:flex;justify-content:center;margin-bottom:22px;padding-top:16px}
.wheel-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:32px;color:var(--gold);z-index:5;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.wheel-spin{width:100%;max-width:420px;aspect-ratio:1/1;border-radius:50%;box-shadow:0 0 0 7px #6f4d13,0 12px 34px rgba(0,0,0,.5);transform:rotate(0deg)}
.wheel-spin canvas{width:100%;height:100%;display:block;border-radius:50%}

.winner-box{display:none;text-align:center;padding:20px 0 6px}
.winner-box .crown{font-size:50px}
.winner-box h2{margin:10px 0 3px;font-size:30px;color:var(--gold)}
.winner-box p{margin:0;font-size:15px;color:var(--muted)}

.actions{display:flex;gap:14px;margin-top:18px}
.actions .btn{flex:1}

.side-title{font-size:16px;font-weight:900;color:var(--gold);margin:0 0 14px}
.winners-list{max-height:560px;overflow:auto;padding-right:4px}
.list-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid #221c10;font-size:13.5px
}
.list-item:last-child{border-bottom:none}
.list-item b{color:#fff;font-size:14.5px}
.list-item span{color:var(--muted);font-size:11.5px}
.badge{background:rgba(30,211,147,.15);color:var(--green);border:1px solid var(--green);border-radius:99px;padding:3px 10px;font-size:10px;font-weight:900;white-space:nowrap}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0}
.status{font-size:12.5px;text-align:center;margin-top:10px;color:var(--muted);min-height:16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="gateCard">
    <header class="top" style="justify-content:center;margin-bottom:14px">
      <div class="brand" style="flex-direction:column;text-align:center">
        <div class="logo">🔒</div>
        <h1>PANEL PANITIA</h1>
        <p>Masukkan PIN untuk membuka undian doorprize</p>
      </div>
    </header>
    <label for="pinInput">PIN Panitia</label>
    <input class="field" id="pinInput" type="password" inputmode="numeric" placeholder="••••••">
    <button class="btn" id="btnUnlock">🔓 BUKA PANEL</button>
    <div class="status" id="gateStatus"></div>
  </div>

  <div id="panelWrap" style="display:none">
    <header class="top">
      <div class="brand">
        <div class="logo">🎡</div>
        <div>
          <h1>UNDIAN DOORPRIZE VIPT CUP IV 2026</h1>
          <p>Panel Panitia • Versi Desktop</p>
        </div>
      </div>
      <a class="mobile-link" href="doorprize-admin.html" onclick="try{sessionStorage.setItem('viptForceMobileAdmin','1')}catch(e){}">📱 Buka Versi HP</a>
    </header>

    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>TOTAL PESERTA</span></div>
      <div class="stat"><b id="statSisa">0</b><span>BELUM MENANG</span></div>
      <div class="stat"><b id="statMenang">0</b><span>SUDAH MENANG</span></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <div class="wheel-spin" id="wheelSpin"><canvas id="wheelCanvas" width="640" height="640"></canvas></div>
        </div>

        <div class="winner-box" id="winnerBox">
          <div class="crown">👑</div>
          <h2 id="winnerName">-</h2>
          <p id="winnerRtRw">-</p>
        </div>

        <button class="btn" id="btnSpin">🎡 PUTAR UNDIAN</button>
        <div class="actions" id="confirmActions" style="display:none">
          <button class="btn" id="btnConfirmWin">✅ TANDAI PEMENANG</button>
          <button class="btn secondary" id="btnSpinAgain">🔁 PUTAR ULANG</button>
        </div>
        <div class="status" id="spinStatus"></div>
      </div>

      <div class="card">
        <div class="side-title">🏆 Riwayat Pemenang</div>
        <div class="winners-list" id="winnersCard">
          <div class="empty">Belum ada pemenang.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* Ganti PIN di sini kapan saja (samakan dengan doorprize-admin.html) */
const ADMIN_PIN="12345";

const DOORPRIZE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};
const DP_ENTRIES_PATH="vipt_doorprize/entries";
const DP_WINNERS_PATH="vipt_doorprize/winners";
let dpApp=null,dpAuth=null,dpDB=null;
let ENTRIES={}; // id -> {nama,rtrw,won}
let currentPick=null; // {id,nama,rtrw}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function truncateLabel(s,max){s=String(s||"");return s.length>max? s.slice(0,max-1)+"…":s}

const gateCard=document.getElementById("gateCard"),panelWrap=document.getElementById("panelWrap"),
      pinInput=document.getElementById("pinInput"),btnUnlock=document.getElementById("btnUnlock"),gateStatus=document.getElementById("gateStatus"),
      statTotal=document.getElementById("statTotal"),statSisa=document.getElementById("statSisa"),statMenang=document.getElementById("statMenang"),
      wheelSpin=document.getElementById("wheelSpin"),wheelCanvas=document.getElementById("wheelCanvas"),wheelCtx=wheelCanvas.getContext("2d"),
      btnSpin=document.getElementById("btnSpin"),spinStatus=document.getElementById("spinStatus"),
      winnerBox=document.getElementById("winnerBox"),winnerName=document.getElementById("winnerName"),winnerRtRw=document.getElementById("winnerRtRw"),
      confirmActions=document.getElementById("confirmActions"),btnConfirmWin=document.getElementById("btnConfirmWin"),btnSpinAgain=document.getElementById("btnSpinAgain"),
      winnersCard=document.getElementById("winnersCard");

let isSpinning=false;
const WHEEL_CV=wheelCanvas.width,WHEEL_CENTER=WHEEL_CV/2,WHEEL_RADIUS=WHEEL_CV/2-6;

function drawWheel(list){
  const ctx=wheelCtx,n=list.length;
  ctx.clearRect(0,0,WHEEL_CV,WHEEL_CV);
  if(!n){
    ctx.beginPath();ctx.arc(WHEEL_CENTER,WHEEL_CENTER,WHEEL_RADIUS,0,Math.PI*2);
    ctx.fillStyle="#0c0b09";ctx.fill();
    ctx.strokeStyle="#6f4d13";ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle="#c7c0b2";ctx.font="700 28px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("Belum ada peserta",WHEEL_CENTER,WHEEL_CENTER);
    return;
  }
  const seg=(Math.PI*2)/n;
  const maxChars = n<=10?20 : n<=20?14 : n<=40?10 : n<=80?7 : 5;
  const fontSize = n<=10?28 : n<=20?22 : n<=40?17 : n<=80?13 : 11;
  for(let i=0;i<n;i++){
    const start=-Math.PI/2+i*seg,end=start+seg;
    ctx.beginPath();
    ctx.moveTo(WHEEL_CENTER,WHEEL_CENTER);
    ctx.arc(WHEEL_CENTER,WHEEL_CENTER,WHEEL_RADIUS,start,end);
    ctx.closePath();
    ctx.fillStyle=i%2===0?"#f5b72b":"#1a1509";
    ctx.fill();
    ctx.strokeStyle="#050505";ctx.lineWidth=2;ctx.stroke();

    const mid=start+seg/2;
    ctx.save();
    ctx.translate(WHEEL_CENTER,WHEEL_CENTER);
    ctx.rotate(mid);
    ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.fillStyle=i%2===0?"#241a06":"#f5c451";
    ctx.font="800 "+fontSize+"px Arial";
    ctx.fillText(truncateLabel(list[i].nama,maxChars),WHEEL_RADIUS-16,0);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(WHEEL_CENTER,WHEEL_CENTER,WHEEL_CV*0.05,0,Math.PI*2);
  ctx.fillStyle="#050505";ctx.fill();
  ctx.lineWidth=6;ctx.strokeStyle="#f5b72b";ctx.stroke();
}

function renderIdleWheel(){
  if(isSpinning)return;
  wheelSpin.style.transition="none";
  wheelSpin.style.transform="rotate(0deg)";
  drawWheel(pesertaBelumMenang());
}

btnUnlock.addEventListener("click",()=>{
  if(pinInput.value.trim()===ADMIN_PIN){
    gateCard.style.display="none";panelWrap.style.display="block";
    initFirebase();
  }else{
    gateStatus.textContent="⚠️ PIN salah, coba lagi.";
  }
});
pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")btnUnlock.click()});

async function initFirebase(){
  try{
    dpApp=firebase.apps.find(a=>a.name==="viptDoorprize")||firebase.initializeApp(DOORPRIZE_FIREBASE_CONFIG,"viptDoorprize");
    dpAuth=dpApp.auth();dpDB=dpApp.database();
    await dpAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!dpAuth.currentUser)await dpAuth.signInAnonymously();
    dpDB.ref(DP_ENTRIES_PATH).on("value",snap=>{
      ENTRIES=snap.val()||{};
      renderStats();renderIdleWheel();
    });
    dpDB.ref(DP_WINNERS_PATH).on("value",snap=>{
      renderWinners(snap.val()||{});
    });
    spinStatus.textContent="✅ Terhubung • data peserta live";
  }catch(e){
    console.error("Admin init:",e);
    spinStatus.textContent="⚠️ Gagal terhubung ["+(e?.code||"koneksi-error")+"]";
  }
}

function pesertaBelumMenang(){
  return Object.entries(ENTRIES).filter(([id,v])=>!v.won).map(([id,v])=>({id,...v}));
}

function renderStats(){
  const all=Object.values(ENTRIES),sisa=pesertaBelumMenang();
  statTotal.textContent=all.length;
  statSisa.textContent=sisa.length;
  statMenang.textContent=all.length-sisa.length;
  btnSpin.disabled=sisa.length===0;
  if(sisa.length===0)spinStatus.textContent="Belum ada peserta tersisa untuk diundi.";
}

function renderWinners(winners){
  const arr=Object.values(winners).sort((a,b)=>(b.wonAt||0)-(a.wonAt||0));
  if(!arr.length){winnersCard.innerHTML=`<div class="empty">Belum ada pemenang.</div>`;return}
  winnersCard.innerHTML=arr.map(w=>`
    <div class="list-item">
      <div><b>${esc(w.nama)}</b><br><span>${esc(w.rtrw)}</span></div>
      <span class="badge">🏆 MENANG</span>
    </div>`).join("");
}

btnSpin.addEventListener("click",()=>{
  const sisa=pesertaBelumMenang();
  if(!sisa.length)return;
  isSpinning=true;
  btnSpin.disabled=true;btnSpin.style.display="none";
  winnerBox.style.display="none";confirmActions.style.display="none";
  spinStatus.textContent="🎡 Sedang mengundi...";

  drawWheel(sisa);

  const n=sisa.length;
  const winnerIdx=Math.floor(Math.random()*n);
  const winner=sisa[winnerIdx];
  currentPick=winner;

  const seg=360/n;
  const thetaCenter=(winnerIdx+0.5)*seg;
  const spins=8;
  const targetRotation=spins*360-thetaCenter;

  wheelSpin.style.transition="none";
  wheelSpin.style.transform="rotate(0deg)";
  void wheelSpin.offsetWidth;
  wheelSpin.style.transition="transform 4.6s cubic-bezier(.12,.72,.15,1)";
  wheelSpin.style.transform=`rotate(${targetRotation}deg)`;

  setTimeout(()=>{
    winnerName.textContent=winner.nama;
    winnerRtRw.textContent=winner.rtrw;
    winnerBox.style.display="block";
    confirmActions.style.display="flex";
    spinStatus.textContent="🎉 Hasil undian ditemukan! Konfirmasi untuk mencatat pemenang.";
  },4700);
});

btnConfirmWin.addEventListener("click",async()=>{
  if(!currentPick||!dpDB)return;
  btnConfirmWin.disabled=true;
  try{
    const updates={};
    updates[`${DP_ENTRIES_PATH}/${currentPick.id}/won`]=true;
    updates[`${DP_WINNERS_PATH}/${currentPick.id}`]={
      nama:currentPick.nama,rtrw:currentPick.rtrw,entryId:currentPick.id,
      wonAt:firebase.database.ServerValue.TIMESTAMP
    };
    await dpDB.ref().update(updates);
    spinStatus.textContent="✅ Pemenang tercatat!";
    resetSpinUI();
  }catch(e){
    console.error("Confirm win:",e);
    spinStatus.textContent="⚠️ Gagal mencatat pemenang ["+(e?.code||"unknown")+"], coba lagi.";
    btnConfirmWin.disabled=false;
  }
});

btnSpinAgain.addEventListener("click",()=>{
  currentPick=null;
  resetSpinUI();
});

function resetSpinUI(){
  isSpinning=false;
  winnerBox.style.display="none";
  confirmActions.style.display="none";
  btnSpin.style.display="block";
  btnSpin.disabled=false;
  btnConfirmWin.disabled=false;
  renderIdleWheel();
}
</script>
</body>
</html>
