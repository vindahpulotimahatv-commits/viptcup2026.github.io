<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>Seed Data Awal Pemain Idola • Panitia</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{--gold:#f5b72b;--muted:#c7c0b2;--green:#1ed393}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
button{font:inherit}
.card{max-width:460px;width:100%;background:linear-gradient(145deg,#11100d,#050505);border:1px solid #6f4d13;border-radius:18px;padding:24px 20px;text-align:center}
.logo{font-size:36px;margin-bottom:8px}
h1{font-size:15px;color:var(--gold);margin:0 0 10px}
p{font-size:11.5px;color:var(--muted);line-height:1.7;margin:0 0 14px}
.list{text-align:left;background:#0c0b09;border:1px solid #221c10;border-radius:12px;padding:12px 14px;margin-bottom:16px;max-height:260px;overflow:auto;font-size:11.5px}
.list div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a1509}
.list div:last-child{border-bottom:none}
.list b{color:var(--gold)}
.btn{display:block;width:100%;text-align:center;color:#090705;background:linear-gradient(135deg,#f5b72b,#9a650b);border:none;border-radius:12px;padding:14px;font-size:12.5px;font-weight:900;cursor:pointer;margin-bottom:10px}
.btn:disabled{opacity:.5}
.status{font-size:11.5px;margin-top:10px;color:var(--muted);min-height:16px}
.back{display:inline-block;margin-top:10px;color:#f5c451;text-decoration:none;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌱</div>
  <h1>SEED DATA AWAL PEMAIN IDOLA</h1>
  <p>Data ini hasil gabungan dari 3 kategori (Volly Putri, Badminton Putri, Badminton Putra) sebelum data lama terhapus. Total 882 suara akan dimasukkan sebagai data awal.</p>
  <div class="list" id="listBox"></div>
  <button class="btn" id="btnSeed">🌱 MASUKKAN DATA AWAL INI</button>
  <a class="back" href="index.html">← Kembali ke Beranda</a>
  <div class="status" id="statusMsg">Memuat...</div>
</div>

<script>
const VOTE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};
const BASELINE_PATH="vipt_vote/idola_baseline";

const BASELINE_DATA={
  "Risna (E5/3A - bunda Riza)":95,
  "Syifa (E2/29)":82,
  "Erni (E2/45 - mm wishang)":73,
  "Iqbal (E2/39)":62,
  "Ressya (E2/28 - Tante Resya)":61,
  "Adel (E5/06)":55,
  "Lambang (E2/22)":47,
  "Bilqis (E2/07)":38,
  "Kang ded":34,
  "Neza (E2/22)":32,
  "Puji (E2/22 - mm lambang)":29,
  "Adin (E8/02)":29,
  "Hendy (E2/39)":27,
  "Ayu (E2/03 - Mak Ndut)":25,
  "Nopy (E2/39 - Tante nopy)":23,
  "Faozi (E5/16)":20,
  "Pak uki":15,
  "Nina (E5/07 - Tante Nina)":14,
  "Bety (E5/08 - mm Vino)":14,
  "Diantoro (E2/22)":14,
  "Sherly (E2/40 - Tante Sherly)":13,
  "P.susilo":13,
  "Jarun (E2/46)":12,
  "Ngudi (E2/15)":11,
  "Jihan (E2/13)":10,
  "Ajrul (E2/40)":10,
  "Hafiza (E2/03)":7,
  "Rohyana (E2/07 - mm bilqis)":6,
  "Dina (E2/41 - mm qiandra)":5,
  "Rosiyati (E2/15 - mm Fadia)":3,
  "Seny (E2/14 - mm Hanum)":3
};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const listBox=document.getElementById("listBox"),statusMsg=document.getElementById("statusMsg"),btnSeed=document.getElementById("btnSeed");
let db=null;

listBox.innerHTML=Object.entries(BASELINE_DATA).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div><span>${esc(n)}</span><b>${c}</b></div>`).join("");

async function init(){
  try{
    const app=firebase.apps.find(a=>a.name==="viptVote")||firebase.initializeApp(VOTE_FIREBASE_CONFIG,"viptVote");
    const auth=app.auth();db=app.database();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!auth.currentUser)await auth.signInAnonymously();
    const snap=await db.ref(BASELINE_PATH).once("value");
    if(snap.exists()){
      statusMsg.textContent="⚠️ Data awal sudah pernah dimasukkan sebelumnya. Klik tombol lagi untuk menimpa ulang.";
    }else{
      statusMsg.textContent="✅ Siap dimasukkan (belum ada data awal tersimpan).";
    }
  }catch(e){
    console.error(e);
    statusMsg.textContent="⚠️ Gagal terhubung ["+(e?.code||"error")+"]";
  }
}

btnSeed.addEventListener("click",async()=>{
  if(!db){statusMsg.textContent="⚠️ Belum terhubung ke server.";return}
  if(!confirm("Masukkan data awal ini ke hasil Pemain Idola? Data ini akan digabung dengan vote baru yang masuk."))return;
  btnSeed.disabled=true;btnSeed.textContent="MENYIMPAN...";
  try{
    const safeData={};
    Object.entries(BASELINE_DATA).forEach(([name,count])=>{
      const key=name.replace(/[.#$\[\]\/]/g,"_");
      safeData[key]={name,count};
    });
    await db.ref(BASELINE_PATH).set(safeData);
    statusMsg.textContent="✅ Data awal berhasil dimasukkan! Cek halaman Hasil Pemain Idola.";
    btnSeed.textContent="✅ SUDAH DIMASUKKAN";
  }catch(e){
    console.error(e);
    statusMsg.textContent="⚠️ Gagal menyimpan ["+(e?.code||"error")+"]";
    btnSeed.disabled=false;btnSeed.textContent="🌱 MASUKKAN DATA AWAL INI";
  }
});

init();
</script>
</body>
</html>
