<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>Reset Data Voting • Panitia VIPT CUP IV 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{--gold:#f5b72b;--muted:#c7c0b2;--red:#ff5a5f;--green:#1ed393}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
button{font:inherit}
.card{max-width:440px;width:100%;background:linear-gradient(145deg,#11100d,#050505);border:1px solid #6f4d13;border-radius:18px;padding:26px 22px;text-align:center}
.logo{font-size:38px;margin-bottom:10px}
h1{font-size:16px;color:var(--gold);margin:0 0 10px}
p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px}
.count-box{background:#0c0b09;border:1px solid #6f4d13;border-radius:12px;padding:14px;margin-bottom:18px}
.count-box b{font-size:26px;color:var(--gold);display:block}
.count-box span{font-size:10px;color:var(--muted)}
.btn{display:block;width:100%;text-align:center;color:#fff;background:linear-gradient(135deg,#ff5a5f,#8a1e22);border:none;border-radius:12px;padding:14px;font-size:12.5px;font-weight:900;cursor:pointer;margin-bottom:10px}
.btn:disabled{opacity:.5}
.btn.secondary{background:linear-gradient(135deg,#2a2a2a,#0e0e0e);color:#f5c451;border:1px solid #6f4d13}
.status{font-size:11.5px;margin-top:12px;color:var(--muted);min-height:16px}
.back{display:inline-block;margin-top:14px;color:#f5c451;text-decoration:none;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🗑️</div>
  <h1>RESET DATA VOTING</h1>
  <p>Hapus semua data voting Atlet Terfavorit yang sudah masuk (tidak bisa dikembalikan).</p>

  <div class="count-box">
    <b id="voteCount">-</b>
    <span>TOTAL SUARA TERSIMPAN SAAT INI</span>
  </div>

  <button class="btn" id="btnReset">🗑️ HAPUS SEMUA DATA VOTING</button>
  <a class="back" href="index.html">← Kembali ke Beranda</a>
  <div class="status" id="statusMsg">Memuat...</div>
</div>

<script>
const VOTE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};
const VOTE_PATH="vipt_vote/votes";
let db=null;

const voteCount=document.getElementById("voteCount"),statusMsg=document.getElementById("statusMsg"),btnReset=document.getElementById("btnReset");

async function init(){
  try{
    const app=firebase.apps.find(a=>a.name==="viptVote")||firebase.initializeApp(VOTE_FIREBASE_CONFIG,"viptVote");
    const auth=app.auth();db=app.database();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!auth.currentUser)await auth.signInAnonymously();
    const snap=await db.ref(VOTE_PATH).once("value");
    const val=snap.val()||{};
    voteCount.textContent=Object.keys(val).length;
    statusMsg.textContent="✅ Terhubung ke server";
  }catch(e){
    console.error(e);
    statusMsg.textContent="⚠️ Gagal terhubung ["+(e?.code||"error")+"]";
  }
}

btnReset.addEventListener("click",async()=>{
  if(!db){statusMsg.textContent="⚠️ Belum terhubung ke server.";return}
  const sure1=confirm("Yakin mau hapus SEMUA data voting? Aksi ini tidak bisa dibatalkan.");
  if(!sure1)return;
  const typed=prompt('Ketik "HAPUS" (huruf besar) untuk konfirmasi terakhir:');
  if(typed!=="HAPUS"){alert("Dibatalkan, teks konfirmasi tidak cocok.");return}

  btnReset.disabled=true;btnReset.textContent="MENGHAPUS...";
  try{
    await db.ref(VOTE_PATH).remove();
    voteCount.textContent="0";
    statusMsg.textContent="✅ Semua data voting berhasil dihapus.";
    btnReset.textContent="✅ SUDAH DIRESET";
  }catch(e){
    console.error(e);
    statusMsg.textContent="⚠️ Gagal menghapus ["+(e?.code||"error")+"]";
    btnReset.disabled=false;btnReset.textContent="🗑️ HAPUS SEMUA DATA VOTING";
  }
});

init();
</script>
</body>
</html>
