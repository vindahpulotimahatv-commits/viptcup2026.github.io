<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#050505">
<title>Atlet Terfavorit RT 08 RW 021 • VIPT CUP IV 2026</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<style>
:root{--bg:#050505;--panel:#0b0b0b;--line:#7a5514;--text:#fff;--muted:#c7c0b2;--gold:#f5b72b;--green:#1ed393;--red:#ff5a5f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;min-height:100%}
body{margin:0;background:#030303;color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding:0 16px}
header{padding:22px 0 10px;text-align:center}
header .logo{font-size:26px}
header h1{font-size:17px;margin:8px 0 2px;color:var(--gold)}
header p{font-size:11px;color:var(--muted);margin:0 0 16px}

.card{background:linear-gradient(145deg,#11100d,#050505);border:1px solid #6f4d13;border-radius:17px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cat-title{font-size:15px;font-weight:900;color:var(--gold);margin:0 0 12px;text-align:center;border-bottom:1px dashed #3a2a08;padding-bottom:10px}

label{display:block;font-size:11px;font-weight:900;color:var(--gold);margin:0 0 6px}
select.field, input.field{
  width:100%;background:#080807;border:1px solid #6f4d13;color:#fff;
  border-radius:12px;padding:12px 13px;outline:none;margin-bottom:14px;font-size:14px;
}
select.field{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url('data:image/svg+xml;utf8,<svg fill="%23f5b72b" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
  background-repeat:no-repeat;background-position-x:96%;background-position-y:center;
}
select.field:focus, input.field:focus{border-color:var(--gold)}

.candidate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#080807;border:1px solid #3a2a08;border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.candidate:last-child{margin-bottom:0}
.candidate.selected{border-color:var(--gold);background:rgba(245,183,43,.08)}
.candidate b{font-size:13px}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid #6f4d13;flex:0 0 auto;position:relative}
.candidate.selected .radio-dot{border-color:var(--gold)}
.candidate.selected .radio-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}

.btn{display:block;width:100%;text-align:center;text-decoration:none;color:#090705;background:linear-gradient(135deg,#f5b72b,#9a650b);border:none;border-radius:12px;padding:14px;font-size:12.5px;font-weight:900;cursor:pointer;margin-top:20px}
.btn:disabled{opacity:.5}
.note{font-size:10px;color:#8a8378;margin-top:10px;line-height:1.5;text-align:center}
.status{font-size:11px;text-align:center;margin-top:10px;color:var(--gold);min-height:14px;font-weight:bold}
.voted-badge{text-align:center;padding:14px;border:1px dashed var(--green);border-radius:12px;color:var(--green);font-size:12px;font-weight:900;margin-top:20px}
.back{display:block;text-align:center;margin-top:16px;font-size:11px;color:#f5c451;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🗳️</div>
    <h1>ATLET TERFAVORIT RT 08 RW 021</h1>
    <p>VIPT CUP IV 2026</p>
  </header>

  <div id="voteArea"></div>

  <a class="back" href="index.html">← Kembali ke Beranda</a>
</div>

<script>
const VOTE_FIREBASE_CONFIG={
  apiKey:"AIzaSyC1g7aKyRf5l6zV0MMbvSY4Gyf7VbDOlCM",
  authDomain:"vipt-survey-2026.firebaseapp.com",
  databaseURL:"https://vipt-survey-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vipt-survey-2026",
  storageBucket:"vipt-survey-2026.firebasestorage.app",
  messagingSenderId:"761699971320",
  appId:"1:761699971320:web:2cabe1effb822597534b0d"
};

// Tetap pakai folder asli agar lolos gembok keamanan Firebase
const VOTE_PATH="vipt_vote/votes";

const VALID_HOUSES = ["E2-1", "E2-2", "E2-3", "E2-3A", "E2-5", "E2-6", "E2-7", "E2-8", "E2-9", "E2-10", "E2-11", "E2-12", "E2-12A", "E2-14", "E2-15", "E2-16", "E2-17", "E2-18", "E2-19", "E2-20", "E2-21", "E2-22", "E2-23", "E2-24", "E2-25", "E2-26", "E2-27", "E2-28", "E2-29", "E2-30", "E2-31", "E2-32", "E2-33", "E2-33A", "E2-35", "E2-36", "E2-37", "E2-38", "E2-39", "E2-40", "E2-41", "E2-42", "E2-43", "E2-44", "E2-45", "E2-46", "E2-47", "E2-48", "E5-1", "E5-2", "E5-3", "E5-3A", "E5-5", "E5-6", "E5-7", "E5-8", "E5-9", "E5-10", "E5-11", "E5-12", "E5-12A", "E5-14", "E5-15", "E5-16", "E5-17", "E5-18", "E5-19", "E5-20", "E6-1", "E6-2", "E6-3", "E6-3A", "E6-5", "E6-6", "E6-7", "E6-8", "E6-9", "E6-10", "E6-11", "E6-12", "E6-12A", "E6-14", "E6-15", "E6-16", "E6-17", "E6-18", "E6-19", "E6-20", "E6-21", "E6-22", "E6-23", "E6-24", "E7-1", "E7-2", "E7-3", "E7-3A", "E7-5", "E7-6", "E7-7", "E7-8", "E7-9", "E7-10", "E7-11", "E7-12", "E7-12A", "E7-14", "E7-15", "E7-16", "E7-17", "E7-18", "E7-19", "E7-20", "E7-21", "E7-22", "E7-23", "E7-24", "E8-1", "E8-2", "E8-3", "E8-3A", "E8-5", "E8-6", "E8-7", "E8-8", "E8-9", "E8-10", "E8-11", "E8-12", "E8-12A", "E8-14", "E8-15", "E8-16", "E8-17", "E8-18", "E8-19", "E8-20", "E8-21", "E8-22", "E8-23", "E8-24"];

const CATEGORIES=[
  {
    id: "bdw",
    label: "Badminton Putri",
    candidates: [
      "Erni (E2/45 - mm wishang)", "Nopy (E2/39 - Tante nopy)", "Sherly (E2/40 - Tante Sherly)", 
      "Ressya (E2/28 - Tante Resya)", "Bety (E5/08 - mm Vino)", "Risna (E5/3A - bunda Riza)", 
      "Neza (E2/22)", "Dina (E2/41 - mm qiandra)", "Nina (E5/07 - Tante Nina)", "Puji (E2/22 - mm lambang)"
    ]
  },
  {
    id: "bdm",
    label: "Badminton Putra",
    candidates: [
      "Adin (E8/02)", "Diantoro (E2/22)", "Iqbal (E2/39)", "Hendy (E2/39)", "Jarun (E2/46)", 
      "Lambang (E2/22)", "Ngudi (E2/15)", "Faozi (E5/16)", "Ajrul (E2/40)", "Pak uki", "Kang ded", "P.susilo"
    ]
  },
  {
    id: "vw",
    label: "Volly Putri",
    candidates: [
      "Puji (E2/22 - mm lambang)", "Rohyana (E2/07 - mm bilqis)", "Rosiyati (E2/15 - mm Fadia)", 
      "Seny (E2/14 - mm Hanum)", "Ayu (E2/03 - Mak Ndut)", "Adel (E5/06)", "Syifa (E2/29)", 
      "Bilqis (E2/07)", "Hafiza (E2/03)", "Jihan (E2/13)", "Erni (E2/45 - mm wishang)"
    ]
  }
];

let voteApp=null,voteAuth=null,voteDB=null;
let selections = { bdw: null, bdm: null, vw: null };

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const voteArea=document.getElementById("voteArea");

function renderVoteArea(){
  let optionsHtml = `<option value="" selected disabled>-- Pilih Blok & Nomer Rumah --</option>`;
  VALID_HOUSES.forEach(house => {
    optionsHtml += `<option value="${house}">${house}</option>`;
  });

  let htmlStr = `
    <div class="card">
      <label for="inputHouse">Nomor Rumah Warga</label>
      <select class="field" id="inputHouse">
        ${optionsHtml}
      </select>
      
      <label for="inputName">Nama Pemilih</label>
      <input type="text" class="field" id="inputName" placeholder="Contoh: Budi Santoso" autocomplete="off" maxlength="60" style="margin-bottom:10px;">
      
      <p class="note" style="margin-top:0;text-align:left">Silakan pilih nomer rumah dan isi nama Anda. Maksimal 2 orang pemilih untuk satu nomor rumah.</p>
    </div>
  `;

  CATEGORIES.forEach(cat => {
    htmlStr += `
      <div class="card" id="card-${cat.id}">
        <div class="cat-title">${esc(cat.label)}</div>
        <div class="candidate-list" data-cat="${cat.id}">
          ${cat.candidates.map(name => `
            <div class="candidate" data-name="${esc(name)}">
              <b>${esc(name)}</b>
              <div class="radio-dot"></div>
            </div>
          `).join('')}
        </div>
      </div>`;
  });

  htmlStr += `
    <button class="btn" id="btnVoteAll">🗳️ KIRIM SEMUA VOTE SEKALIGUS</button>
    <div class="status" id="statusMsg"></div>
    <p class="note">Pilih satu kandidat di setiap kategori. Vote bersifat anonim untuk publik, tapi tercatat oleh panitia. Tidak bisa diubah setelah dikirim.</p>`;

  voteArea.innerHTML = htmlStr;

  CATEGORIES.forEach(cat => {
    const listWrapper = document.querySelector(`.candidate-list[data-cat="${cat.id}"]`);
    const candidates = listWrapper.querySelectorAll(".candidate");
    
    candidates.forEach(el => {
      el.addEventListener("click", () => {
        selections[cat.id] = el.dataset.name;
        candidates.forEach(c => c.classList.toggle("selected", c === el));
      });
    });
  });

  const btnVote = document.getElementById("btnVoteAll");
  const statusMsg = document.getElementById("statusMsg");

  btnVote.addEventListener("click", async () => {
    let houseVal = document.getElementById("inputHouse").value;
    let voterNameVal = document.getElementById("inputName").value.trim();
    
    if(!houseVal) {
        statusMsg.textContent="⚠️ Silakan pilih nomer rumah Anda terlebih dahulu.";
        document.getElementById("inputHouse").focus();
        return;
    }
    if(!voterNameVal) {
        statusMsg.textContent="⚠️ Silakan isi nama pemilih.";
        document.getElementById("inputName").focus();
        return;
    }

    for(const cat of CATEGORIES) {
      if(!selections[cat.id]) {
        statusMsg.textContent=`⚠️ Anda belum memilih kandidat untuk ${cat.label}.`;
        document.getElementById(`card-${cat.id}`).scrollIntoView({behavior: "smooth", block: "center"});
        return;
      }
    }

    if(!voteDB){statusMsg.textContent="⚠️ Belum terhubung ke server, coba lagi sebentar.";return}
    
    btnVote.disabled=true;
    btnVote.textContent="MEMERIKSA KUOTA...";
    statusMsg.textContent="Memeriksa kuota rumah Anda...";

    try{
      const snap = await voteDB.ref(VOTE_PATH).orderByChild("houseNumber").equalTo(houseVal).once("value");
      const existingData = snap.val() || {};
      
      // Hitung kuota khusus untuk suara yang punya "Label V2" saja
      const validRecords = Object.values(existingData).filter(v => v.voteVersion === 2);
      const totalRecords = validRecords.length;
      
      if (totalRecords >= 6) {
          statusMsg.innerHTML=`⚠️ Nomer rumah <b>${houseVal}</b> sudah mencapai batas maksimal (2 pemilih).`;
          btnVote.disabled=false;
          btnVote.textContent="🗳️ KIRIM SEMUA VOTE SEKALIGUS";
          return;
      }

      btnVote.textContent="MENGIRIM DATA...";
      statusMsg.textContent="Memproses suara Anda...";

      const promises = CATEGORIES.map(cat => {
        return voteDB.ref(VOTE_PATH).push().set({
          category: cat.id,
          categoryLabel: cat.label,
          candidate: selections[cat.id],
          houseNumber: houseVal,
          voterName: voterNameVal,
          voteVersion: 2, // <-- TRIK RESET: Menyematkan "Label V2" ke database
          votedAt: firebase.database.ServerValue.TIMESTAMP
        });
      });

      await Promise.all(promises);

      voteArea.innerHTML=`
        <div class="card">
          <div class="cat-title">Terima Kasih, ${esc(voterNameVal)}!</div>
          <p style="text-align:center;font-size:12px;color:var(--muted);margin:0">Suara dari perwakilan warga rumah <b>${houseVal}</b> berhasil masuk.</p>
          <div class="voted-badge">✅ Kamu sudah melakukan voting.</div>
          <button class="btn" style="margin-top:16px; background:linear-gradient(135deg,#3a2a08,#11100d); color:var(--gold); border:1px solid #6f4d13;" onclick="location.reload()">🔄 Isi Suara Anggota Keluarga Lain</button>
        </div>`;
      
    }catch(e){
      console.error("Vote submit:",e);
      statusMsg.textContent="⚠️ Gagal mengirim vote. Periksa koneksi internet Anda.";
      btnVote.disabled=false;
      btnVote.textContent="🗳️ KIRIM SEMUA VOTE SEKALIGUS";
    }
  });
}

async function initFirebase(){
  try{
    voteApp=firebase.apps.find(a=>a.name==="viptVote")||firebase.initializeApp(VOTE_FIREBASE_CONFIG,"viptVote");
    voteAuth=voteApp.auth();voteDB=voteApp.database();
    await voteAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(!voteAuth.currentUser)await voteAuth.signInAnonymously();
  }catch(e){
    console.error("Vote init:",e);
  }
}

renderVoteArea();
initFirebase();
</script>
</body>
</html>
